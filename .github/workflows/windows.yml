name: Pacote Windows

on:
  push:
    branches: [main, motor-vulkan]
    paths:
      - 'App/**'
      - 'Build.ps1'
      - 'scripts/package-windows.py'
      - 'tests/ExportSmoke/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar o editor
        run: ./Build.ps1 -SelfContained
      - name: Montar o ZIP
        run: python scripts/package-windows.py
      - name: Verificar exportação de teste
        run: |
          Expand-Archive dist/VideoNR-win64.zip -DestinationPath dist/test
          $editor = Start-Process -FilePath (Resolve-Path dist/test/VideoNR.exe).Path -PassThru
          try {
            Start-Sleep -Seconds 5
            $editor.Refresh()
            if ($editor.HasExited) { throw "O editor fechou na abertura (código $($editor.ExitCode))." }
          } finally {
            if (!$editor.HasExited) { Stop-Process -Id $editor.Id }
          }
          ./dist/test/motor/ffmpeg.exe -v error -f lavfi -i 'testsrc2=size=128x72:rate=12' -f lavfi -i 'sine=frequency=440' -t 2 -c:v libx264 -c:a aac dist/input.mp4
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao gerar vídeo de teste.' }
          dotnet run --project tests/ExportSmoke -- dist/test/motor dist/input.mp4 dist
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao exportar vídeo de teste.' }
      - name: Publicar a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-$($env:GITHUB_SHA.Substring(0, 12))"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/VideoNR-win64.zip --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag dist/VideoNR-win64.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Vídeo NR Editor para Windows" --notes "Extraia o ZIP inteiro e abra VideoNR.exe. O pacote inclui os componentes de exportação e melhoria neural para NVIDIA e AMD com Vulkan."
          }
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar a release.' }
