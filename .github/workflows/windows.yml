name: Build e Releases Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar GitHub Release com os ZIPs completos'
        type: boolean
        default: false
      release_tag:
        description: 'Tag da release manual (ex: v1.0.0; vazio usa windows-<sha>)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Executar testes unitários
        run: dotnet run --project Tests/VideoNR.Tests.csproj
      - name: Verificar as janelas e capturar a interface
        run: dotnet run --project Tests.Windows/VideoNR.WindowsTests.csproj
      - uses: actions/upload-artifact@v4
        with:
          name: interface-windows
          path: ui-snapshots/*.png
      - name: Registrar capturas para a atualização da documentação
        if: github.head_ref == 'fix/timeline-export-fidelity' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Get-ChildItem ui-snapshots/*.png | ForEach-Object {
            $body = @{ content = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName)); encoding = 'base64' } | ConvertTo-Json -Compress
            $sha = $body | gh api -X POST "repos/$env:GITHUB_REPOSITORY/git/blobs" --input - --jq .sha
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao registrar captura.' }
            Write-Host "$($_.Name) $sha"
          }
      - name: Compilar o editor
        run: ./Build.ps1 -SelfContained
      - name: Configurar Python para empacotamento
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/timeline-export-fidelity'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Empacotar o motor e o editor
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/timeline-export-fidelity'
        run: python scripts/package-windows.py
      - name: Testar a primeira abertura dos ZIPs
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/timeline-export-fidelity'
        run: ./scripts/test-package.ps1 -Directory dist
      - name: Disponibilizar pacote AMD
        if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/timeline-export-fidelity'
        uses: actions/upload-artifact@v4
        with:
          name: VideoNR-AMD-win64
          path: dist/VideoNR-AMD-win64.zip
          compression-level: 0
          retention-days: 14
      - name: Disponibilizar pacote NVIDIA
        if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/timeline-export-fidelity'
        uses: actions/upload-artifact@v4
        with:
          name: VideoNR-NVIDIA-win64
          path: dist/VideoNR-NVIDIA-win64.zip
          compression-level: 0
          retention-days: 14
      - name: Publicar a release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            $tag = $env:REF_NAME
          } elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            $tag = $env:INPUT_TAG.Trim()
          } else {
            $tag = "windows-$($env:GITHUB_SHA.Substring(0, 12))"
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/VideoNR-NVIDIA-win64.zip dist/VideoNR-AMD-win64.zip --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag dist/VideoNR-NVIDIA-win64.zip dist/VideoNR-AMD-win64.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Vídeo NR Editor ($tag)" --notes "Escolha o ZIP da sua GPU, extraia todo o conteúdo e abra VideoNR.exe. O motor de renderização já vem no ZIP."
          }
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar a release.' }
