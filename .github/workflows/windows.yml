name: Pacotes Windows

on:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'upstream/**'
      - 'Engine.cpp'
      - 'Build.ps1'
      - 'scripts/package-windows.py'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar o editor
        run: ./Build.ps1 -SelfContained
      - name: Empacotar o motor e o editor
        run: python scripts/package-windows.py
      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-$($env:GITHUB_SHA.Substring(0, 12))"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/VideoNR-NVIDIA-win64.zip dist/VideoNR-AMD-win64.zip --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag dist/VideoNR-NVIDIA-win64.zip dist/VideoNR-AMD-win64.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Vídeo NR Editor para Windows" --notes "Escolha o ZIP da sua GPU, extraia todo o conteúdo e abra VideoNR.exe. O motor Veyra 2.2.0 já está incluído."
          }
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar a release.' }
